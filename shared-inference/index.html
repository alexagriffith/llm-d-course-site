<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shared inference</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;color:#edf4fb;background:#07111d}
*{box-sizing:border-box}body{margin:0}main{max-width:1400px;margin:auto;padding:24px 28px 40px}

[hidden]{display:none!important}.flow-modes p[aria-live]{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.candidate{margin:16px 0}.candidate>a{display:block;overflow:auto;border:1px solid #364f67;border-radius:6px}.candidate img{display:block;width:100%;min-width:900px;height:auto;aspect-ratio:1500/970;object-fit:contain;background:#07111d}
.candidate-tools{font-size:13px;text-align:right;margin:8px 0}.explanation{border-top:1px solid #364f67;padding-top:12px;margin-top:12px}.explanation summary{cursor:pointer;font-size:14px;color:#b9cad8}.explanation p{margin-top:12px}
.view-pager{display:flex;justify-content:space-between;align-items:center;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(1344px,calc(100% - 28px));background:#07111d;z-index:10;padding:12px 0;border-top:1px solid #364f67}.view-pager span{font-size:13px;color:#b9cad8}body{padding-bottom:80px}
@media(max-width:700px){main{padding:18px 14px}h1{font-size:23px}#view-nav{gap:4px 12px}.flow-modes button{padding:8px;font-size:13px}.view>h2{height:54px}.view>.cols{height:64px}.view-controls{height:180px}}
</style></head><body><main><h1>Shared inference</h1><nav id="view-nav" aria-label="Inference topics"></nav><div id="views"></div><script>
const views=[{"id":"architecture","title":"Shared architecture","question":"Where do live, direct batch, and queued requests enter the shared serving path?"},{"id":"batch","title":"batch API → inference","question":"Where does the batch API call terminate, and how does a job become model requests?"},{"id":"priority","title":"Priority and endpoint selection","question":"Who assigns priority, and how does Endpoint Picker use it?"},{"id":"queues","title":"Queues and overload","question":"What waits where, and what protection happens before dispatch?"},{"id":"retry","title":"Errors, results and retry","question":"Who sends the error, retains the request, and makes the next attempt?"},{"id":"objects","title":"Control-plane objects","question":"Which objects configure the runtime components?"}];
for(const v of views){
 const id=v.id,card=document.createElement('section');card.id=id;card.className='view';
 document.getElementById('view-nav').insertAdjacentHTML('beforeend','<a href="#'+id+'">'+v.title+'</a>');
 card.innerHTML='<h2>'+v.title+'</h2><div class="cols"><p>'+v.question+'</p></div>';
 const figure=document.createElement('figure');figure.className='candidate';
 figure.innerHTML='<a href="#" target="_blank" rel="noopener"><img alt="'+v.title+'"></a><div class="candidate-tools"><a href="#" target="_blank" rel="noopener">Open diagram ↗</a></div>';
 card.append(figure);document.getElementById('views').append(card);
  if(id==='architecture'){
  const modes=document.createElement('div');modes.className='flow-modes';modes.setAttribute('aria-label','Architecture flow');
  modes.innerHTML='<div role="group" aria-label="Caller paths"><button type="button" data-caller="all">All</button><button type="button" data-caller="live">Live</button><button type="button" data-caller="sync">Direct batch</button><button type="button" data-caller="async">Queued</button></div><div role="group" aria-label="Flow direction"><button type="button" data-flow="requests">Requests</button><button type="button" data-flow="results">Responses and results</button></div><p class="muted" aria-live="polite"></p>';
 figure.before(modes);
  const legend=document.createElement('p');legend.className='muted';legend.style.fontSize='14px';legend.textContent='Blue: live HTTP. Purple: batch and async transport. Gray: Gateway ↔ vLLM. Arrowheads show direction; dashed arrows connect Gateway and Endpoint Picker.';modes.append(legend);
  const descriptions={requests:'Live clients and direct batch dispatch send HTTP to Envoy. Batch or background applications can instead enqueue work for Async Processor, which sends HTTP to Envoy.',results:'Envoy returns HTTP to each caller. Async Processor publishes terminal results to configured output queues for batch or background collection.'};
  const questions={requests:'Where do live, direct batch, and queued requests enter the shared serving path?',results:'How do inference responses return to live, direct batch, and queued callers?'};
  let selectedFlow='requests',selectedCaller='all';
  const callers={live:'live client',sync:'batch processor',async:'Async Processor'};
  const focusedDescriptions={live:{requests:'Live client sends HTTP to Envoy, which consults Endpoint Picker.',results:'The selected vLLM replica responds through Envoy to the live client.'},sync:{requests:'The batch processor sends HTTP to Envoy, which consults Endpoint Picker.',results:'The selected vLLM replica responds through Envoy to the batch processor.'},async:{requests:'Batch and background applications enqueue compatible requests. Async Processor sends HTTP to Envoy.',results:'Envoy returns HTTP to Async Processor, which publishes terminal results for the configured batch or background consumer.'}};
  function showArchitecture(){const mode=selectedFlow,caller=selectedCaller;const url=`review-candidates/architecture-${mode}${caller==='all'?'':'-'+caller}.svg`;const description=caller==='all'?descriptions[mode]:focusedDescriptions[caller][mode];card.querySelector('.cols p').textContent=caller==='all'?questions[mode]:mode==='requests'?`How do requests from the ${callers[caller]} enter the shared serving path?`:`How do inference responses return to the ${callers[caller]}?`;figure.querySelector('img').src=url;figure.querySelector('img').alt='Shared architecture: '+description;figure.querySelector('a').href=url;figure.querySelector('.candidate-tools a:last-child').href=url;modes.querySelector('p').textContent=description;modes.querySelectorAll('[data-flow]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.flow===mode)));modes.querySelectorAll('[data-caller]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.caller===caller)));}
  modes.querySelectorAll('[data-flow]').forEach(b=>b.onclick=()=>{selectedFlow=b.dataset.flow;showArchitecture();});modes.querySelectorAll('[data-caller]').forEach(b=>b.onclick=()=>{selectedCaller=b.dataset.caller;showArchitecture();});showArchitecture();
 }
 if(id==='batch'){
  const modes=document.createElement('div');modes.className='flow-modes';modes.setAttribute('role','group');modes.setAttribute('aria-label','Batch flow direction');
  modes.innerHTML='<div role="group" aria-label="Batch operation"><button type="button" data-batch-operation="submission">Batch input</button><button type="button" data-batch-operation="execution">Inference dispatch</button><button type="button" data-batch-operation="output">Batch output</button></div><div role="group" aria-label="Flow direction"><button type="button" data-batch-flow="requests">Requests</button><button type="button" data-batch-flow="results">Responses and results</button></div>';
  figure.before(modes);
  const questions={submission:'How does the client upload a file and create a batch from it?',execution:{requests:'How does the batch processor dispatch individual inference requests?',results:'How do inference responses return to the batch processor?'},output:{requests:'How does the client request its output file?',results:'How are results saved and file contents returned to the client?'}};
  let operation='submission',direction='requests';
  function showBatch(){
    const file=operation==='submission'?'batch-submission':operation==='output'?`batch-output-${direction}`:direction==='requests'?'batch':'batch-results';
    const url=`review-candidates/${file}.svg?v=source-parity-20261006`,question=operation==='submission'?questions.submission:questions[operation][direction];
    card.querySelector('.cols p').textContent=question;figure.querySelector('img').src=url;figure.querySelector('img').alt=question;figure.querySelector('a').href=url;figure.querySelector('.candidate-tools a:last-child').href=url;
    modes.querySelector('[aria-label="Flow direction"]').hidden=operation==='submission';
    modes.querySelectorAll('[data-batch-flow]').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.batchFlow===direction));b.textContent=operation==='output'?(b.dataset.batchFlow==='requests'?'File requests':'File contents'):(b.dataset.batchFlow==='requests'?'Inference requests':'Inference responses');});
    modes.querySelectorAll('[data-batch-operation]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.batchOperation===operation)));
  }
  modes.querySelectorAll('[data-batch-flow]').forEach(b=>b.onclick=()=>{direction=b.dataset.batchFlow;showBatch();});modes.querySelectorAll('[data-batch-operation]').forEach(b=>b.onclick=()=>{operation=b.dataset.batchOperation;showBatch();});showBatch();
 }
 if(id==='queues'){
  const answer=document.createElement('p');answer.className='queue-answer muted';answer.style.fontSize='14px';figure.before(answer);
  const modes=document.createElement('div');modes.className='flow-modes';modes.setAttribute('role','group');modes.setAttribute('aria-label','Queue question');
  modes.innerHTML='<button type="button" data-queues="locations">Queue flow</button><button type="button" data-queues="protection">Admission</button><button type="button" data-queues="eviction">In-flight eviction</button>';
  figure.before(modes);
  const questions={locations:'How does work move through the queues?',protection:'How does admission control requests before dispatch?',eviction:'What can happen when an in-flight request is evicted?'};
  const directions=document.createElement('div');directions.className='flow-modes';directions.setAttribute('role','group');directions.setAttribute('aria-label','Queue flow direction');directions.innerHTML='<button type="button" data-direction="requests">Requests</button><button type="button" data-direction="results">Responses and results</button><button type="button" data-direction="all">All</button>';modes.after(directions);
  let queueDirection='requests';
  function showQueues(mode){const url=`review-candidates/queues-${mode==='locations'?queueDirection:mode}.svg`;const question=mode==='locations'?{requests:'Where do jobs and inference requests wait before execution?',results:'How do responses and queued results reach their callers and consumers?',all:'Where are the queues, and how does work move between them?'}[queueDirection]:questions[mode];card.querySelector('.cols p').textContent=question;answer.textContent={locations:'The PostgreSQL job queue holds validating, unclaimed jobs referencing input files. The API stores each job; a processor claims it for execution. The optional async request queues hold individual inference requests from batch or background applications; outputs go to configured result queues. The Redis-style retry schedule holds eligible requests until another attempt is due. Endpoint Picker has a separate in-memory admission queue when flow control is enabled. Each vLLM replica has its own scheduler waiting queue.',protection:'With admission control enabled, Endpoint Picker can queue requests before dispatch. Once admitted, Envoy forwards a request to a replica, where the vLLM scheduler may queue it before execution. Admission rejection returns an HTTP error without dispatching that request.',eviction:'With eviction enabled, Endpoint Picker selects a tracked in-flight request and sends an ext_proc ImmediateResponse to Envoy. Envoy stops the backend HTTP stream for that request. The caller gets 429 if headers have not been sent; otherwise the stream may reset.'}[mode];figure.querySelector('img').src=url;figure.querySelector('img').alt=question;figure.querySelector('a').href=url;figure.querySelector('.candidate-tools a:last-child').href=url;card.dataset.queueMode=mode;directions.hidden=mode!=='locations';modes.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.queues===mode)));directions.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.direction===queueDirection)));}
  const evictionCallers=document.createElement('div');evictionCallers.className='flow-modes';evictionCallers.setAttribute('role','group');evictionCallers.setAttribute('aria-label','Evicted caller');evictionCallers.innerHTML='<button type="button" data-evicted-caller="live">Live caller</button><button type="button" data-evicted-caller="async">Async caller · 429 and retry</button>';directions.after(evictionCallers);
  let evictedCaller='live';const baseShowQueues=showQueues;
  showQueues=function(mode){baseShowQueues(mode);evictionCallers.hidden=mode!=='eviction';if(mode==='eviction'){
    if(evictedCaller==='async'){const url='review-candidates/queues-eviction-async.svg';const question='How can an async request retry after eviction returns 429?';card.querySelector('.cols p').textContent=question;figure.querySelector('img').src=url;figure.querySelector('img').alt=question;figure.querySelector('a').href=url;figure.querySelector('.candidate-tools a:last-child').href=url;answer.textContent='In this example, Envoy evicts the request before sending response headers and returns HTTP 429 to Async Processor. If retry policy permits, the transport retains the request until its retry time, returns it to the request queue, and Async Processor sends a new HTTP attempt. If the request cannot retry, Async Processor publishes a final result.';}
    else answer.textContent+=' The live caller decides whether to retry; Endpoint Picker does not retain or resubmit it.';
  }evictionCallers.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.evictedCaller===evictedCaller)));};
  evictionCallers.querySelectorAll('button').forEach(b=>b.onclick=()=>{evictedCaller=b.dataset.evictedCaller;showQueues('eviction');});
  directions.querySelectorAll('button').forEach(b=>b.onclick=()=>{queueDirection=b.dataset.direction;showQueues('locations');});
  modes.querySelectorAll('button').forEach(b=>b.onclick=()=>showQueues(b.dataset.queues));showQueues('locations');
 }
 if(id==='objects'){
  const modes=document.createElement('div');modes.className='flow-modes';modes.setAttribute('role','group');modes.setAttribute('aria-label','Control-plane question');
  modes.innerHTML='<button type="button" data-objects="created">Resource creation</button><button type="button" data-objects="routing">Routing references</button>';
  figure.before(modes);
  const questions={created:'What resources does KServe reconcile?',routing:'How do routing objects connect to the serving components?'};
  function showObjects(mode){const url=`review-candidates/objects-${mode}.svg`;card.querySelector('.cols p').textContent=questions[mode];figure.querySelector('img').src=url;figure.querySelector('img').alt=questions[mode];figure.querySelector('a').href=url;figure.querySelector('.candidate-tools a:last-child').href=url;modes.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.objects===mode)));}
  modes.querySelectorAll('button').forEach(b=>b.onclick=()=>showObjects(b.dataset.objects));showObjects('created');
 }
 if(id==='priority'){
  const modes=document.createElement('div');modes.className='flow-modes';modes.setAttribute('role','group');modes.setAttribute('aria-label','Priority explanation');modes.innerHTML='<button type="button" data-priority="assignment">Assign and apply priority</button><button type="button" data-priority="ranking">Objectives sharing a pool</button>';figure.before(modes);
  function showPriority(mode){const url=`review-candidates/priority${mode==='ranking'?'-ranking':''}.svg`;const question=mode==='ranking'?'How do multiple objectives share one pool, and which priority ranks higher?':'Who assigns priority, and how does Endpoint Picker use it?';card.querySelector('.cols p').textContent=question;figure.querySelector('img').src=url;figure.querySelector('img').alt=question;figure.querySelector('a').href=url;figure.querySelector('.candidate-tools a:last-child').href=url;modes.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.priority===mode)));}
  modes.querySelectorAll('button').forEach(b=>b.onclick=()=>showPriority(b.dataset.priority));showPriority('assignment');
 }
 if(id==='retry'){
  const answer=document.createElement('p');answer.className='muted';answer.style.fontSize='14px';answer.textContent='In this admission-rejection example, Endpoint Picker constructs the 429 and Envoy sends it to Async Processor. Async Processor checks retry policy. The async transport retains eligible requests in its retry schedule, then returns them to the request queue. Async Processor consumes the request and sends the next HTTP attempt.';figure.before(answer);
  const admissionAnswer=answer.textContent;
  const modes=document.createElement('div');modes.className='flow-modes';modes.setAttribute('role','group');modes.setAttribute('aria-label','Error mechanism');modes.innerHTML='<button type="button" data-error="admission">Admission · 429</button><button type="button" data-error="eviction">Eviction · 429</button><button type="button" data-error="server">Backend · 503</button><button type="button" data-error="transport">Transport failure</button>';figure.before(modes);
  const errorViews={admission:['retry','Who sends the error, retains the request, and makes the next attempt?',admissionAnswer],eviction:['queues-eviction-async','Who terminates an in-flight request, and who can retry it?','Endpoint Picker signals eviction; Envoy stops the backend HTTP stream and returns 429 before response headers. Async Processor checks retry policy, and the transport schedules eligible requests for another attempt. A post-header stream reset is a different caller outcome.'],server:['retry-server','How does a backend HTTP error reach Async Processor?','In this 503 example, the selected model server returns an HTTP error through Envoy. Async Processor classifies it as a server error and applies retry policy. If retry policy permits another attempt, the transport schedules the request again. Otherwise, Async Processor publishes a final result to the configured result destination.']};
  errorViews.transport=['retry-transport','How does Async Processor detect a failed HTTP attempt?','This diagram shows an ordinary HTTP send or connection failure: client.Do() returns an error, and the pinned worker emits a terminal error result. This does not prove the backend never received or processed the request. Shutdown cancellation can requeue work; per-request deadline expiry and response-body read failures are separate paths.'];
  function showError(mode){const[file,question,description]=errorViews[mode],url=`review-candidates/${file}.svg`;card.querySelector('.cols p').textContent=question;answer.textContent=description;figure.querySelector('img').src=url;figure.querySelector('img').alt=question;figure.querySelector('a').href=url;figure.querySelector('.candidate-tools a:last-child').href=url;modes.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.error===mode)));}
  modes.querySelectorAll('button').forEach(b=>b.onclick=()=>showError(b.dataset.error));showError('admission');
 }

 if(id==='architecture')card.querySelectorAll('.flow-modes>p:not([aria-live])').forEach(p=>p.remove());
 const controls=document.createElement('div');controls.className='view-controls';controls.setAttribute('aria-label','Diagram settings');
 for(const group of [...card.children].filter(n=>n.classList.contains('flow-modes')))controls.append(group);
 figure.before(controls);
 const details=document.createElement('details');details.className='explanation';details.innerHTML='<summary>Details</summary>';
 // Keep long answers available without pushing the diagram down the page.
 for(const p of [...card.children].filter(n=>n.tagName==='P'))details.append(p);
 const sharedDetails=[
  'Async Processor consumes inference requests in the supported message format. A batch processor or background application can publish those messages; a background application can use Async Processor without Batch Gateway.',
  'Queue symbols show logical roles. Different workloads can use separately configured queues. The transport selects the result destination from configuration or supported request metadata. Request IDs let consumers match results to requests. In response views, the batch and background collection arrows show separately configured destinations; they do not mean that each result is sent to both consumers.',
  'The separate retry schedule shown here uses Redis sorted sets. Other transports can implement retries differently.',
  'Envoy sends request information to Endpoint Picker over ext_proc, then forwards the admitted request to the selected model server. Inference responses return through Envoy. Configured response callbacks let Endpoint Picker observe completion; it is not an inference-response proxy.'
 ];
 const topicDetails={
  architecture:sharedDetails,queues:sharedDetails,retry:sharedDetails,
  priority:[
   'The caller supplies an objective name in x-llm-d-inference-objective. The router also accepts the older x-gateway-inference-objective alias used by the pinned Async Processor. For queued requests, Async Processor can set the objective from queue configuration or its configured objective-merge policy.',
   'Endpoint Picker reads the named objective from its local cache and uses its numeric priority. Controllers keep that cache updated and retain objectives bound to the configured pool. Higher numbers rank ahead of lower numbers. If the objective is missing or its priority is unset, the pinned router uses 0. Admission control and eviction require their respective configuration; a priority value alone does not reserve capacity.'
  ],
  batch:[
   'The batch API creates a job that completes later. In direct HTTP mode, the batch processor sends each inference request and receives its response over HTTP. In queued mode, it publishes individual requests for Async Processor to dispatch.',
   'The API Server creates the file ID, stores the input file and its metadata, then returns the file record. Creating a batch stores a validating job in PostgreSQL before acknowledging it. The job queue is a database query over unclaimed rows; a processor atomically claims a job.',
   'The processor reads the stored input, validates its JSONL records and dispatches individual requests. Request 1, 2 and 3 illustrate fan-out; the dispatcher can run requests concurrently within its configured limits.',
   'The processor collects responses into local JSONL output and error files. During finalization it uploads nonempty files to shared storage, waits for storage success, records file metadata and updates batch status with the file IDs. The output views show the successful path.',
   'The client gets batch status with GET /v1/batches/{id}, reads output_file_id, then downloads GET /v1/files/{id}/content. The API Server reads the stored file and streams its contents back. Downloading a completed file does not pass through the batch job queue. An output file ID can be absent when there are no successful requests.',
   'Both modes belong to the asynchronous batch-job API. A background application can use the queued path without creating a batch job or input file.'
  ],
  objects:[
   'Controllers watch the routing resources and maintain local pool, endpoint and objective state. An InferenceObjective poolRef binds the objective to a pool; Endpoint Picker reads its cached objective and candidate endpoints when handling a request. These reference arrows do not represent a Kubernetes API lookup for every request.'
  ]
 };
 for(const text of topicDetails[id]||[]){const note=document.createElement('p');note.textContent=text;details.append(note);}
 if(details.children.length>1)card.append(details);
}
const pager=document.createElement('div');pager.className='view-pager';
pager.innerHTML='<button type="button" id="previous-view">← Previous view</button><span id="view-position" aria-live="polite"></span><button type="button" id="next-view">Next view →</button>';
document.getElementById('views').after(pager);
let activeView=0;
function selectView(){
 const index=views.findIndex(v=>'#'+v.id===location.hash);activeView=index<0?0:index;
 views.forEach((v,i)=>{document.getElementById(v.id).hidden=i!==activeView;const link=document.querySelector('#view-nav a[href="#'+v.id+'"]');if(i===activeView)link.setAttribute('aria-current','page');else link.removeAttribute('aria-current')});
 document.getElementById('view-position').textContent=(activeView+1)+' / '+views.length;
 document.getElementById('previous-view').disabled=activeView===0;
 document.getElementById('next-view').disabled=activeView===views.length-1;
}
document.getElementById('previous-view').onclick=()=>{location.hash=views[activeView-1].id};
document.getElementById('next-view').onclick=()=>{location.hash=views[activeView+1].id};
window.addEventListener('hashchange',selectView);selectView();

// Hash navigation must not change the shared page origin between topics.
window.addEventListener('hashchange',()=>window.scrollTo(0,0));window.scrollTo(0,0);
